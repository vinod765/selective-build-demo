trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

name: selective-demo_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

parameters:
- name: SELECTIVE_MODE
  displayName: Selection mode
  type: string
  default: path
  values:
  - path
  - all

variables:
- name: EFFECTIVE_SELECTIVE_MODE
  value: ${{ parameters.SELECTIVE_MODE }}

stages:
# This stage runs for every trigger type, but path-based selection is used
# only when Build.Reason is PullRequest.
- stage: SelectiveDecision
  displayName: Calculate build scope
  dependsOn: []
  pool:
    vmImage: ubuntu-latest

  jobs:
  - job: determine_scope
    displayName: Determine affected platforms

    steps:
    - checkout: self
      fetchDepth: 0
      submodules: false
      displayName: Checkout full history

    - bash: |
        set -euo pipefail

        if [ "$(Build.Reason)" = "PullRequest" ]; then
          target_branch="$(System.PullRequest.TargetBranchName)"

          if [ -z "$target_branch" ]; then
            echo "##vso[task.logissue type=error]Pull-request target branch is empty."
            exit 1
          fi

          git fetch --no-tags --prune origin \
            "+refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"

          base_ref="origin/${target_branch}"
          selection_mode="${EFFECTIVE_SELECTIVE_MODE:-path}"

          echo "Build reason: PullRequest"
          echo "Target branch: ${target_branch}"
          echo "Selection mode: ${selection_mode}"
        else
          # Scheduled, push, manual, and other non-PR builds must retain
          # all-platform behavior.
          base_ref="$(Build.SourceVersion)"
          selection_mode="all"

          echo "Build reason: $(Build.Reason)"
          echo "Non-PR build detected; forcing selection mode to all."
        fi

        python3 scripts/selective_build.py \
          --base "$base_ref" \
          --head "$(Build.SourceVersion)" \
          --mode "$selection_mode" \
          --output "$(Pipeline.Workspace)/selection.json"

        echo "Selection result:"
        cat "$(Pipeline.Workspace)/selection.json"

        run_all="$(
          python3 -c '
        import json
        with open("'"$(Pipeline.Workspace)/selection.json"'", encoding="utf-8") as file:
            print(str(json.load(file)["run_all"]).lower())
        '
        )"

        run_vs_tests="$(
          python3 -c '
        import json
        with open("'"$(Pipeline.Workspace)/selection.json"'", encoding="utf-8") as file:
            print(str(json.load(file)["run_vs_tests"]).lower())
        '
        )"

        platforms="$(
          python3 -c '
        import json
        with open("'"$(Pipeline.Workspace)/selection.json"'", encoding="utf-8") as file:
            print(",".join(json.load(file)["platforms"]))
        '
        )"

        echo "Selected platforms: ${platforms}"
        echo "Run all: ${run_all}"
        echo "Run VS tests: ${run_vs_tests}"

        echo "##vso[task.setvariable variable=SELECTIVE_RUN_ALL;isOutput=true]${run_all}"
        echo "##vso[task.setvariable variable=SELECTIVE_RUN_VS_TESTS;isOutput=true]${run_vs_tests}"
        echo "##vso[task.setvariable variable=SELECTIVE_PLATFORMS;isOutput=true]${platforms}"
      name: selection
      displayName: Publish selection outputs

- stage: Build
  displayName: Simulated platform builds
  dependsOn:
  - SelectiveDecision

  variables:
  - name: SELECTIVE_RUN_ALL
    value: $[ stageDependencies.SelectiveDecision.determine_scope.outputs['selection.SELECTIVE_RUN_ALL'] ]

  - name: SELECTIVE_PLATFORMS
    value: $[ stageDependencies.SelectiveDecision.determine_scope.outputs['selection.SELECTIVE_PLATFORMS'] ]

  jobs:
  - template: .azure-pipelines/demo-platform-jobs.yml
    parameters:
      platform: vs

  - template: .azure-pipelines/demo-platform-jobs.yml
    parameters:
      platform: vpp

  - template: .azure-pipelines/demo-platform-jobs.yml
    parameters:
      platform: alpinevs

  - template: .azure-pipelines/demo-platform-jobs.yml
    parameters:
      platform: broadcom

  - template: .azure-pipelines/demo-platform-jobs.yml
    parameters:
      platform: mellanox

  - template: .azure-pipelines/demo-platform-jobs.yml
    parameters:
      platform: marvell-prestera-arm64

  - template: .azure-pipelines/demo-platform-jobs.yml
    parameters:
      platform: marvell-prestera-armhf

  - template: .azure-pipelines/demo-platform-jobs.yml
    parameters:
      platform: nvidia-bluefield

  - template: .azure-pipelines/demo-platform-jobs.yml
    parameters:
      platform: aspeed-arm64

- stage: Test
  displayName: Simulated VS tests
  dependsOn:
  - SelectiveDecision
  - Build

  variables:
  - name: SELECTIVE_RUN_VS_TESTS
    value: $[ stageDependencies.SelectiveDecision.determine_scope.outputs['selection.SELECTIVE_RUN_VS_TESTS'] ]

  condition: |
    and(
      succeeded(),
      or(
        ne(variables['Build.Reason'], 'PullRequest'),
        eq(variables['SELECTIVE_RUN_VS_TESTS'], 'true')
      )
    )

  jobs:
  - job: vs_tests
    displayName: Simulated VS tests
    pool:
      vmImage: ubuntu-latest

    steps:
    - bash: |
        set -euo pipefail
        echo "SIMULATED VS TESTS"
        echo "Build reason: $(Build.Reason)"
        echo "Selective VS tests: $(SELECTIVE_RUN_VS_TESTS)"